name: CI

on:
  push:
    branches: [main, wave2-integration, perf/production-readiness-sweep]
  pull_request:
    branches: [main, wave2-integration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# uv discipline. Every job in this file obeys three rules, enforced by
# tests/test_ci_workflow.py so a forgotten flag fails a PR instead of silently
# changing what CI tested.
#
# Rules 1 and 3 are not left to each job to remember: they live in the shared
# composite action at .github/actions/setup-uv-env, which is the only place in
# the repository that CI builds an environment. A job says what extras and
# groups it needs and nothing else, so there is no per-job flag to forget and
# no pair of flags that has to be kept in step by hand.
#
# 1. Sync exactly once per job, always with `--locked`. Both `--locked` and
#    `--frozen` refuse to re-resolve, so neither can install a version the lock
#    never described; they differ on what happens when pyproject.toml and
#    uv.lock disagree. `--frozen` ignores the disagreement and produces a green
#    job silently missing a newly added dependency. `--locked` asserts the lock
#    is up to date and fails instead. `--locked` is the only sanctioned form.
#
# 2. Every command downstream of that sync uses `uv run --no-sync`, never a
#    bare `uv run`. A bare `uv run` re-resolves the interpreter and re-syncs on
#    every invocation. Its implicit sync is inexact (it will not uninstall an
#    already-installed extra), but if it decides the venv it finds is on the
#    wrong interpreter it REMOVES that venv and rebuilds it from the DEFAULT
#    dependency set, dropping every extra and non-default group the explicit
#    sync installed. `--no-sync` uses the environment exactly as the sync left
#    it and downgrades that interpreter disagreement to a warning.
#
# 3. Pin the interpreter for the WHOLE job via UV_PYTHON, which the shared
#    action writes to $GITHUB_ENV, not via a per-command `--python` flag.
#    `uv python install 3.12` only downloads an interpreter; it does not
#    select one, so a later `uv sync` with no `--python` reads .python-version
#    (3.13) and builds a 3.13 environment under a step labelled "Set up Python
#    3.12" -- which is what several jobs here used to do. UV_PYTHON is read by
#    `sync` and `run` alike, so nothing downstream can disagree with the sync.
#
# `--no-dev` is the only sanctioned pruning, and only for deployment
# artifacts. Anything that would otherwise be injected with `uv run --with`
# belongs in a declared dependency group instead, so it is resolved by the
# lock like everything else.

jobs:
  admin-css-drift:
    # The compiled admin.css cannot go stale (B4): Tailwind compiles
    # nothing at runtime, so a class added to a template or the static JS
    # while this file stayed as-built ships dead styles with no failing
    # test anywhere. This job recompiles from src/taskq/web/static/
    # tailwind.css and refuses a dirty tree - the same compile → diff
    # contract a lockfile check uses. The in-suite scanner
    # (tests/web_admin/test_admin_css_drift.py) is the belt to these
    # braces: it reds locally without Node, and its known-token floor
    # would catch this job being silently dropped.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Recompile admin.css and refuse a dirty tree
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --exit-code -- src/taskq/web/static/admin.css

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uv-env

      - name: Lint with ruff
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The e2e group is required here: tests/e2e type-checks against
      # containerspec (TYPE_CHECKING imports of BuiltImage), which the
      # default dev group deliberately does not include.
      - uses: ./.github/actions/setup-uv-env
        with:
          sync-args: --all-extras --group dev --group e2e

      - name: Type check with pyright
        run: uv run --no-sync pyright src/taskq tests

  type-probes:
    # T01's negative type-probe corpus: the workflows API's wrong-shape
    # calls MUST red on BOTH pinned checkers (pyright 1.1.414 + ty 0.0.85
    # — the `typeprobe` group, pinned exactly; the exclude-newer
    # quarantine is waived for ty because the pin IS the review). The
    # corpus is checked under tests/typeprobe's own pyrightconfig.json —
    # the root config's `tests` environment sets reportArgumentType=false,
    # which would mute exactly the violations the probes assert. The gate
    # script asserts per-marker coverage and CAN fail (drilled: an
    # `entry: Any` door reverts the gate to red — recorded
    # .measurements/attack/F9-red-type-gate.txt).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uv-env
        with:
          # --locked is NOT repeated here: the shared action always adds it
          # itself (its documented contract), and passing it again dies on
          # uv's "the argument '--locked' cannot be used multiple times"
          # before a single probe runs (the d24f17b9 CI conviction).
          sync-args: --group typeprobe

      - name: The MUST_ERROR corpus reds on both pinned checkers
        run: uv run --no-sync python tests/typeprobe/_gate.py

  test:
    # The per-interpreter suite: ALL extras installed, the whole test suite
    # -n 2, not -n 4: the lanes were calibrated for the 8-core larger
    # runner (a dedicated core per worker) but run on the 4-core standard
    # runner (the labels matched none): at -n 4 the four workers plus the
    # PG and Redis containers all contend for 4 cores, and every
    # sub-second settle budget in the suite becomes a lottery (the
    # moving-red class of 2026-09-24/25: a different test each run, all
    # green solo). The 451 precedent: the density is the defect.

    # except the load-sensitive family (which owns its serial lane below).
    # One leg per Python version replaces the old 12-leg matrix (3 x 4
    # extra-sets, each re-running the same 9,000 tests with different skips):
    # the extras' tests were the only per-leg difference, and they now have
    # their own spot-check legs below. The intended lane is the 4-core
    # larger runner at -n 4 (the same per-core density the fast lanes
    # always ran, a dedicated core per worker); the standard runner is the
    # stand-in until the org's larger-runner labels exist: the pinned
    # labels matched no runner and queued these legs forever.
    #
    # STAGED FLIP, measured 2026-10-06 (local A/B, same commit, CI-exact
    # invocation; the CI-runtime measurement PR). Still NOT active: the
    # org's larger-runner labels match no runner (see above), so -n 2 on
    # the 4-core standard runner remains the measured optimum here —
    # flipping -n WITHOUT the runner is the measured regression. When the
    # org's 8-core larger-runner label exists, flip BOTH halves of these
    # three legs together (runner AND -n; either half alone is measured
    # harm):
    #
    #     test:       runs-on: <the org's 8-core label>   -n 2 -> -n 4
    #     coverage:   runs-on: <the org's 8-core label>   -n 2 -> -n 4
    #     slow-suite: runs-on: <the org's 8-core label>   -n 2 -> -n 4
    #
    # i.e. this leg becomes:
    #
    #     runs-on: <the org's 8-core larger-runner label>
    #     ...
    #     run: uv run --no-sync pytest -n 4 -m "not slow and not load_sensitive" -o faulthandler_timeout=300
    #
    # The numbers behind the flip: fast leg 2343.9s at -n 2 -> 1303.0s at
    # -n 4 (−44.4%), 12,557 passed both ways, workers 96.5-99.0% busy —
    # the packing survives the wider pool. Slow lane 203.2s -> 100.9s
    # (−50.3%; at -n 2 its second worker idles 61.3% of the session behind
    # the soak module, and -n 4 splits that load). Stopping short of the
    # runner flip is measured harm, not caution: -n 8 on shared cores
    # reproduced the moving-red class above AND inflated summed work
    # +32.8% (per-worker setup duplication), and the coverage leg's tracer
    # taxes density-starved workers +22-55% wall (2026-09-22, below).
    # -n 4 is a win only with a dedicated core per worker.
    # timeout 55: the suite's honest -n 2 runtime measured 39-41 min
    # (2026-10-10: 39:16, 40:39, 41:33 across the runs) — the 45-min cap's
    # 5-minute margin lost to runner variance twice (the runs
    # 38049228451/38072348161: both test 3.12/3.14 legs cancelled at
    # ~45:00 mid-suite, no failure inside them). The cap exists to catch
    # HANGS (faulthandler 300s is the per-test net) — a 15-minute margin
    # over the honest runtime still catches the hang class without
    # racing the weather.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # fail-fast off: the matrix exists to answer "which interpreters still
    # pass" in one run — cancelling the surviving legs on the first red
    # hides exactly that (the 2026-10-10 run 38024700612: one leg's red
    # orphan-terminated the 3.13/3.14 suites mid-run at 39m50, three
    # "failures" none of which were interpreter defects). Same discipline
    # as the PG deploy matrix below.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # fetch-depth 0: same reason as the coverage job — history-sensitive
      # guards (tests/test_breaking_change_markers.py) walk the branch's
      # commits against the base ref, which a shallow PR checkout does not
      # provide.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The shared action exports UV_PYTHON for the whole job, so the sync
      # and every uv call in the leg agree on the interpreter by
      # construction.
      - uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ matrix.python-version }}
          sync-args: --all-extras --group dev

      # The admin UI's page component (src/taskq/web/static/admin.js) is
      # tested by driving it under Node; the workflow-level pin
      # (tests/test_ci_workflow.py) requires Node on every pytest job.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # A leg must fail loudly if it is ever running an interpreter other
      # than the one it advertises.
      - name: Verify the interpreter matches this matrix leg
        run: |
          uv run --no-sync python -c "import sys; want='${{ matrix.python-version }}'; got='.'.join(map(str, sys.version_info[:2])); assert got == want, f'matrix leg {want} is running {got}'"

      # The lane filter: 'not slow and not load_sensitive'. The slow tier
      # moved out of these legs after the 3.14 leg's 30-minute cap killed
      # it mid-soak: the lost-job soak's own committed wall bounds
      # (pytest-timeout 2700s per trial, the settle backstop's 4s/job x
      # ~486 jobs = 1944s) exceed the job's remaining budget the moment
      # co-tenancy (4 pytest workers + docker + the containers' PG on the
      # same 4 threads) pushes a trial off its fast regime, and a
      # pytest-timeout bound cannot fire inside a job cap that fires
      # first - the leg goes silent at 99% and cancels with zero output.
      # The slow tier's lane below runs it at -n 2, the density its
      # fast regime assumes, on one interpreter: the slow tier's value is
      # behaviour, not runtime parity (that lane's own comment). The
      # load-sensitive tier has its own lane for the same wall-clock
      # reason.
      - name: Run the suite (all extras, minus slow and load-sensitive)
        # faulthandler_timeout: DUMP-ONLY stack dumps (no exit) when a test
        # outlives pytest-timeout's own 300s budget by any margin, so a
        # hung leg NAMES its test and its blocked frames instead of going
        # silent until the job cap cancels with zero output (the 3.12 leg
        # of PR #492 sat silent for 11 minutes at 99% with nothing in the
        # log). Scoped to THIS step's command line, not pyproject's ini
        # options: the slow lane's soak legitimately runs 2700s trials
        # under per-test @pytest.mark.timeout(2700), which a global
        # faulthandler timer cannot see and would dump on every run.
        # Dump-only on purpose: a worker that exits on the dump would turn
        # pytest-timeout's graceful per-test failure into a lost worker.
        run: uv run --no-sync pytest -n 2 -m "not slow and not load_sensitive" -o faulthandler_timeout=300

  test-extras:
    # The extra-gated families, one leg per extra: install the extra, run
    # ONLY its tagged tests. Each leg is small (seconds to minutes), so it
    # stays on a standard runner: GitHub bills per second but rounds up to
    # the minute, and a larger runner would cost more and buy nothing at
    # this duration. The importorskip guards inside these files stay as the
    # safety net for local runs without selection; under selection they are
    # dead code by construction.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - { extra: aad, sync: "--extra aad" }
          - { extra: saml, sync: "--extra saml --extra fastapi" }
          - { extra: oidc, sync: "--extra oidc --extra fastapi" }
          - { extra: otel, sync: "--extra otel --extra fastapi" }
          # The prometheus leg needs fastapi too: the metrics-router suites
          # (test_prometheus_metrics, test_prometheus_endpoint_e2e) drive
          # create_metrics_router through FastAPI's TestClient. The extra's
          # own contract test (test_prometheus_extra_contract) imports ONLY
          # the [prometheus] extra's dependencies, so the extra's core
          # surface is proven under this sync as well.
          - { extra: prometheus, sync: "--extra prometheus --extra fastapi" }
          - { extra: vault, sync: "--extra vault" }
          - { extra: aws, sync: "--extra aws" }
          - { extra: redis, sync: "--extra redis --extra fastapi" }
          - { extra: fastapi, sync: "--extra fastapi" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
        with:
          sync-args: ${{ matrix.sync }} --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run the extra's own tests
        # The fastapi leg installs no redis, so the tests tagged for both
        # extras run in the redis leg (which installs fastapi) only.
        run: uv run --no-sync pytest -n 2 -m "${{ matrix.extra == 'fastapi' && 'fastapi and not redis' || matrix.extra }}"

  test-cross:
    # Common extra PAIRS in one process: both families' tests run together
    # in a single interpreter so cross-talk (shared session state, module
    # interplay, container contention) surfaces here rather than in a
    # user's install. Small legs, standard runners.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - { pair: "redis and oidc", select: "redis or oidc", sync: "--extra redis --extra oidc --extra fastapi" }
          - { pair: "redis and saml", select: "redis or saml", sync: "--extra redis --extra saml --extra fastapi" }
          - { pair: "saml and oidc", select: "saml or oidc", sync: "--extra saml --extra oidc --extra fastapi" }
          - { pair: "aad and redis", select: "aad or redis", sync: "--extra aad --extra redis --extra fastapi" }
          - { pair: "otel and fastapi", select: "otel or (fastapi and not redis)", sync: "--extra otel --extra fastapi" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
        with:
          sync-args: ${{ matrix.sync }} --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run both families together
        run: uv run --no-sync pytest -n 2 -m "${{ matrix.select }}"

  test-timescale:
    # The optional-TimescaleDB lane (TASKQ_TIMESCALEDB_HYPERTABLES): the
    # feature's own module, run for real. Like the slow and e2e tiers, the
    # containers are testcontainers booted by the fixtures themselves (the
    # module's timescale_container and the shared pg_dsn pair), so this job
    # needs only Docker on the runner - a service container would be dead
    # weight no test reads. TASKQ_TEST_TIMESCALEDB_IMAGE is pinned to the
    # same tag the module defaults to, so the lane and the module can never
    # disagree about which server they mean. Serially, not under xdist: the
    # module boots ONE module-scoped timescale container, and each xdist
    # worker would boot its own.
    #
    # The check at the bottom is the lane's contract: every test of the
    # module must RUN. skip_test_without_docker() makes a container-less
    # run exit 0 with skips, so a green lane with skips would prove
    # nothing - the summary is parsed and any skip, deselection, or
    # failure fails the job. Bump the floor when the module grows.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uv-env
        with:
          sync-args: --all-extras --group dev

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run the hypertable module (a skip here is a failure)
        env:
          TASKQ_TEST_TIMESCALEDB_IMAGE: timescale/timescaledb:2.30.1-pg18
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/timescale-pytest.txt"
          uv run --no-sync pytest tests/test_timescaledb_hypertables.py -rs | tee "$out"
          uv run --no-sync python - "$out" <<'PY'
          import re
          import sys

          summary = open(sys.argv[1], encoding="utf-8").read().strip().splitlines()[-1]
          passed = int(re.search(r"(\d+) passed", summary).group(1))
          assert passed >= 11, f"the module's 11 tests did not all pass: {summary}"
          for bad in ("skipped", "deselected", "failed", "error"):
              assert bad not in summary, f"the lane must be skip-free: {summary}"
          PY

  slow-suite:
    # The slow-marked family's own lane: the fleet/chaos tier whose tests are
    # wall-clock-bound (lease expirations, failover windows, subprocess-timed
    # chaos) and boot the shared Postgres + Dragonfly pair. Split out of the
    # 12-leg `test` matrix so a slow-tier failure reruns THIS lane only,
    # instead of re-running the fast matrix twelve times to reach the one
    # slow test that flaked. Required, never skipped: it runs on every push
    # and PR exactly like the e2e lane, and the fast lane's `-m "not slow"`
    # is only sound because this lane runs what it deselects. Ubuntu provides
    # Docker (testcontainers); one leg on the default interpreter, because
    # interpreter coverage is the fast matrix's job and the slow tier's value
    # is behaviour, not runtime parity.
    # The slow tier is the wave's longest wall-clock lane (wall-clock-bound
    # lease/failover/chaos windows), so it runs on the 8-core larger runner:
    # the per-worker core density doubles and the lane's wall time drops
    # accordingly, at the larger runner's linear per-core cost. Parallelism
    # stays at -n 2: every test here is xdist-safe by construction (this lane
    # has always run -n 2), and the wall-clock scenarios must not tighten
    # further under heavier packing.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Defaults are exactly this family's environment: --all-extras --group
      # dev (redis included — the fleet and chaos tests are redis-marked, and
      # a leg that silently skipped them would be coverage loss wearing a
      # green checkmark).
      - uses: ./.github/actions/setup-uv-env

      - name: Run the slow suite
        run: uv run --no-sync pytest -n 2 -m "slow and not load_sensitive"

  load-sensitive:
    # The wall-clock/timing guards (watchdog lag sampling, terminal-write
    # budget, cron commit gates, otel overhead, bootstrap slots) assert on
    # elapsed time, so they are load-fragile: under xdist a sibling's CPU
    # churn shows up as flake. They run here, ONCE per CI run, serially, on
    # a standard runner (the job is ~2 minutes: GitHub bills per second but
    # rounds up to the minute, so a larger runner would cost more and buy
    # nothing for a serial lane). Every other lane deselects the family via
    # "not load_sensitive"; this lane is the one place it runs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # The workflow-level pin (test_ci_workflow.py) requires Node on every
      # job whose pytest can reach tests/web_admin; keep it unconditional.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: ./.github/actions/setup-uv-env

      - name: Run the load-sensitive suite serially
        run: uv run --no-sync pytest -m "load_sensitive"

  coverage:
    # The coverage lane is the single longest CI job (the whole suite, one
    # leg). The 8-core larger runner at -n 4 keeps the per-worker core
    # density identical to -n 2 on 4 cores (the timing-sensitive tests'
    # flake exposure is a per-core-density property, not a
    # parallelism-count property) and roughly halves the wall time; the
    # larger runner's cost is linear per core, so this is the cheapest
    # wall-clock minute CI sells.
    #
    # The larger-runner label does not exist yet (the same stand-in note
    # lives on the `test` matrix above), so this leg runs on the standard
    # runner, and the density it advertises has to come from the worker
    # count instead: -n 2 on 4 cores is 2 cores per worker, the density
    # this lane was calibrated for. Measured on 2026-09-22, the -n 4
    # stand-in (1 core per worker) stacked the coverage tracer's CPU tax
    # on an already-saturated runner, and the instrumented leg became a
    # harsher environment than the uninstrumented legs it shadows:
    #
    # - Wall tax (same commit, same filter, same -n 4, same runner type,
    #   per-run pairs): the coverage leg's pytest wall ran 1123-1187s
    #   (median 1123) against the plain test legs' 651-979s, +22-55%.
    #   Locally, matched A/B (3 runs per config): heartbeat-chaos 22.6 ->
    #   30.1s (+33%), cancel-sweep2 8.1 -> 13.8s (+69%), cron-integration
    #   13.7 -> 16.9s (+23%); peak worker RSS +15% (489 -> 565MB tree,
    #   110 -> 127MB per process) -- a wall tax, not a memory trap.
    # - Board tally, same day (118 CI runs, 43 red): 11 instances of a
    #   test failing on the coverage leg while green on ALL THREE plain
    #   legs of the same run, against 9 instances in the other direction
    #   across three times the leg-opportunities (the matrix runs three
    #   legs per run, coverage one). Per leg-run that is ~9% (11/118) on
    #   coverage vs ~2.5% (9/354) on a plain leg, ~3.7x. Every one of
    #   the 11 was a wall-clock pin firing on starvation artifacts (the
    #   heartbeat-chaos janitorial exit wait, sweep-trial starvation,
    #   clock-smear on measured deltas, equal clock_timestamp() stamps,
    #   a 5s LISTEN delivery wait), not a defect the uninstrumented legs
    #   agreed with.
    #
    # Halving the worker count hands the tracer the spare core instead
    # of the pins' headroom: at -n 2 the instrumented leg's per-worker
    # demand (~1.3-1.7x traced CPU) fits the 2 cores it gets, which is
    # milder than the plain legs' own 4-on-4 packing, so the coverage
    # leg stops being the suite's harshest timing environment. The lane
    # is the same test set with the same gate (--cov-fail-under=90 is
    # untouched and the measured 95% has room); the price is wall time,
    # ~2x the -n 4 median (est. ~37min), priced into the timeout below.
    # The cap needs headroom over the estimate, not parity with it: run
    # 36600780724's coverage job saw the pytest step finish GREEN
    # (12039 passed, gate 95.90%) in 44:44 and the 45-minute cap fire in
    # the step's own teardown - a green leg killed by a cap that prices
    # the median where the weather lands. 60 gives the measured 38-45
    # band its headroom.
    runs-on: ubuntu-latest
    # 60, not 45: the cap priced "~37min" median, but the #606 head's green
    # run was killed at 45m04s - the suite itself had already PASSED
    # (12036 passed, 95.87% >= 90%) four seconds earlier, and the job's
    # CANCELLED verdict was pure wall-clock, not a test failure. The head
    # room a lane needs is measured from its worst observed run plus the
    # report steps, not its median.
    timeout-minutes: 60
    steps:
      # fetch-depth 0: the breaking-change marker guard reads the branch's
      # own commits against the base (git log <base>..HEAD). A shallow PR
      # checkout provides neither the base ref nor the stack's history, so
      # the guard crashes on git exit 128 instead of running.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-uv-env

      # Same reason as the test matrix: the admin.js tests run under Node
      # and fail rather than skip when it is absent under CI=true.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The mark filter matches the test matrix's ('not slow and not
      # load_sensitive'): the wall-clock tiers' slow regimes do not fit a
      # 30-minute lane under co-tenancy, and the gate holds without them -
      # measured 95% against the 90% floor with this exact filter (the
      # slow family's lines are shared with the fast tier's executions of
      # the same code, not exclusive to it). This job stays the one place
      # the fast+integration suite runs with coverage; the slow tier's
      # lane owns the wall-clock families.
      - name: Run tests with coverage gate
        # faulthandler_timeout: same dump-only hang-name as the test
        # matrix's lane (its step comment holds the full rationale; this
        # lane matches the same mark filter, so no 2700s slow-tier trial
        # can trip the timer).
        run: uv run --no-sync pytest -n 2 -m "not slow and not load_sensitive" --cov=taskq --cov-report=term-missing --cov-fail-under=90 -o faulthandler_timeout=300

  e2e:
    # Containerized e2e tier: workers built from the packaged wheel run
    # against testcontainers Postgres + Dragonfly. Serial by design (the
    # suite's isolation contract assumes one test at a time). ubuntu-latest
    # provides Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uv-env
        with:
          sync-args: --all-extras --group dev --group e2e

      # `--group e2e` belongs on the sync above, not here: repeating it on the
      # run would ask uv to sync a second time, and the point of --no-sync is
      # that the environment the sync built is the environment the tests get.
      - name: Run e2e tests
        run: uv run --no-sync pytest --e2e -m e2e tests/e2e --timeout=900 -q

  system-e2e:
    # System-e2e tier: stateful, multi-process lifecycle simulations
    # (rolling deploys, leader kills, broker outages, cancel storms, mixed
    # misbehaving fleets, sustained load) driven through real worker
    # SUBPROCESSES against testcontainers Postgres + Dragonfly. Its own
    # lane for the same reason the e2e and slow lanes exist: the
    # scenarios are wall-clock-bound minutes each, so a failure here must
    # not tax another lane's rerun economics. Modeled on the slow-suite
    # lane (-n 2: every scenario is xdist-safe by construction, each test
    # module owns a module-scoped database on the shared pair, unique
    # health sockets and per-module schemas keep subprocess workers
    # isolated) with the e2e lane's per-test timeout headroom.
    # ubuntu-latest provides Docker; the dev group already carries
    # testcontainers, so no e2e group is needed here.
    #
    # The Postgres VERSION matrix (README's support matrix, issue #334): one
    # leg per supported major, 15 (the declared minimum) through 18 (the
    # default the other PG-touching lanes run). The seam is
    # TASKQ_TEST_PG_IMAGE, which the shared testcontainers harness
    # (taskq/testing/_shared_containers.py) reads for BOTH the shared pair
    # and the sweep prefixes, so an overridden leg is swept by the same rule
    # as the default. This tier is the per-version surface because it applies
    # the full migration chain per module schema and drives real subprocess
    # workers through the whole SQL lifecycle — the claim "PG 15 still works"
    # is proven here, not assumed from the fast suite's PG 18 runs. The e2e
    # lane keeps its own postgres:18 pin (tests/e2e/conftest.py); widening
    # THAT tier is deferred for the same cost/time tradeoff as putting the
    # full `test` suite on the matrix. fail-fast off: the matrix exists to
    # answer "which majors still pass" in one run — cancelling the surviving
    # legs on the first failure would hide exactly that.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uv-env

      # The workflow-level pin (test_ci_workflow.py) requires Node on every
      # job whose pytest invocation can reach tests/web_admin; this job's
      # marker selection does not, but the pin's substring scan cannot tell,
      # so Node is installed unconditionally (same precedent as the
      # load-sensitive lane).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run the system-e2e tier
        env:
          TASKQ_TEST_PG_IMAGE: postgres:${{ matrix.postgres-version }}-alpine
        run: uv run --no-sync pytest --system-e2e -m system tests/system_e2e --timeout=900 -n 2 -q


  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uv-env

      # `--with pip-audit` was both redundant and harmful: pip-audit is already
      # declared in the `dev` group and therefore resolved by uv.lock, so the
      # flag injected a SECOND, separately resolved copy that shadowed the
      # locked one. The auditor that reports on the locked dependency set is
      # now itself part of it.
      #
      # The retries are for PyPI's own JSON API, not for findings: pip-audit
      # queries pypi.org per distribution, and a 503 from that backend (a
      # `ServiceError`, as on run 36419309756) fails the leg without ever
      # reaching an audit verdict. Five attempts with a growing gap rides out
      # the measured band; a real advisory still fails the leg on every
      # attempt, because an advisory is a stable response, not an outage.
      - name: Run pip-audit
        run: |
          for attempt in 1 2 3 4 5; do
            if uv run --no-sync pip-audit; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "pip-audit failed on 5 attempts - treating as a real finding"
          exit 1

  pr-title:
    # The conventional-commit title gate: every PR title must match
    # `type(scope)?: subject` with type one of the conventional types.
    #
    # The deploy-check deadlock lesson, recorded in the ledger: a check that is
    # marked required but does not REGISTER on every PR — the classic cause is
    # a `paths:`/`branches:` filter on the job's trigger — becomes an
    # unmeetable context on exactly the PRs it failed to register for, and the
    # merge queue wedges. So this job has NO path filters of any kind: it runs
    # on EVERY pull_request event, on every PR, whatever it touches, and the
    # only conditional is the event type (there is no PR title to check on a
    # push). Title gating is a property of the PR, not of its diff, so there is
    # no path this check could ever be scoped to anyway.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR title is a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # type(scope)?: subject — scope optional, bang for breaking changes,
          # and the subject may not be empty.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([^)]+\))?(!)?: .+'
          echo "PR title: ${PR_TITLE}"
          if ! grep -Eq "$pattern" <<<"$PR_TITLE"; then
            echo "::error::The PR title must be a conventional commit: " \
              "'type(optional scope)?(optional !): subject'. Allowed types: feat, fix, " \
              "docs, style, refactor, perf, test, build, ci, chore. Example: " \
              "'feat(worker): bound the reclaim sweep'."
            exit 1
          fi

  migrations:
    # The migration upgrade gate, in two legs, both running on EVERY
    # pull_request event (the deadlock lesson above applies verbatim: a
    # `paths:` filter here would make this check unmeetable on exactly the
    # PRs that need it most).
    #
    # The shipped-migration incident: a bundled migration file was rewritten
    # in place, and every deployment that had already applied it began logging
    # migration-checksum-drift on its next migrate — the runtime drift guard
    # (tests/test_migrations_released_frozen.py, taskq.migrate's ledger
    # refusal) catches that at RUNTIME, on someone's database. CI must catch
    # it at PR time instead. The rule is the ledger's own: NEW migration files
    # are legal (fixes ship as new migrations); edits, renames and deletes of
    # RELEASED files are forbidden.
    #
    # Leg 1 (freeze check): the touched files are diffed against the git
    # merge-base and the released manifest
    # (tests/data/released_migrations.sha256). Any modify/rename/delete of a
    # file pinned at the merge base fails the PR; so does removing or
    # rewriting a pin in the manifest itself (a rewritten pin is a rewritten
    # migration wearing a diff the file check cannot see). A pin ADDED in the
    # same PR as its new file is the normal release flow and stays legal.
    #
    # Leg 2 (upgrade path, the base→branch upgrade gate): when the PR's diff
    # touches the migration tree or the manifest at all, a fresh Postgres 18
    # database is migrated with the MERGE BASE's own code, and this branch's
    # code then applies what is pending and must converge — nothing left
    # pending, no checksum drift. This is the real upgrade path an existing
    # deployment takes when it pulls the PR's commit.
    #
    # NO path filters on either job — see pr-title's deadlock note.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The upgrade leg's database, created by the service container below.
      # The base and branch legs share it: the branch leg upgrades what the
      # base leg built.
      TASKQ_PG_DSN: postgresql://postgres:postgres@localhost:5432/taskq_gate
      # The PR's target branch. Empty on push events (no PR base); the freeze
      # step below defaults it to main.
      BASE_REF: ${{ github.base_ref }}
    services:
      # Same major the e2e lane pins (the system-e2e matrix covers 15-18); the
      # upgrade path is exercised against the newest supported server.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskq_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # fetch-depth 0: the merge-base diff needs the base branch's history,
      # which a shallow PR checkout does not provide (same reason as the
      # coverage job).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-uv-env

      - name: Freeze-check the migration tree against the merge base
        id: freeze
        run: |
          set -euo pipefail
          base_sha="$(git merge-base "origin/${BASE_REF:-main}" HEAD)"
          echo "comparing the migration tree against merge base ${base_sha}"
          git diff --name-status "$base_sha" HEAD -- src/taskq/migrations tests/data/released_migrations.sha256 > "$RUNNER_TEMP/migration-changes.txt"
          if git cat-file -e "$base_sha:tests/data/released_migrations.sha256"; then
            git show "$base_sha:tests/data/released_migrations.sha256" > "$RUNNER_TEMP/manifest-base.sha256"
          else
            : > "$RUNNER_TEMP/manifest-base.sha256"
          fi
          cat "$RUNNER_TEMP/migration-changes.txt"
          uv run --no-sync python - <<'PY'
          import os
          import sys
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          changes = (temp / "migration-changes.txt").read_text(encoding="utf-8")

          def parse_manifest(text: str) -> dict[str, str]:
              pinned = {}
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  digest, _, filename = line.partition("  ")
                  if len(digest) != 64 or not filename:
                      raise SystemExit(f"malformed manifest line: {raw!r}")
                  pinned[filename] = digest
              return pinned

          base = parse_manifest((temp / "manifest-base.sha256").read_text(encoding="utf-8"))
          manifest = Path("tests/data/released_migrations.sha256")
          head = parse_manifest(manifest.read_text(encoding="utf-8") if manifest.exists() else "")

          # A file is frozen if it was pinned BEFORE this PR (the base
          # manifest). A pin added in the same PR as its new file is the
          # normal release flow and stays legal; removing or rewriting a base
          # pin is not.
          released = set(base)

          touched = False
          failures = []
          for line in changes.splitlines():
              if not line.strip():
                  continue
              status, _, paths = line.partition("\t")
              paths = paths.split("\t")
              # Deleted paths and rename/copy sources and targets are all "the
              # file moved"; a plain A/M carries one path after the status.
              candidates = paths if status[0] in "DRC" else paths[-1:]
              for path in candidates:
                  if path == "tests/data/released_migrations.sha256":
                      continue
                  if os.path.basename(path) in released:
                      failures.append(
                          f"{status} {path}: a released migration file may not be "
                          "modified, renamed or deleted; fix forward with a new migration"
                      )
                  else:
                      touched = True
          if changes.strip():
              touched = True

          for filename, digest in base.items():
              if head.get(filename) != digest:
                  failures.append(
                      f"the manifest pin for {filename} (sha256 {digest}) was removed "
                      "or changed; released pins are never edited"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"touched={'true' if touched else 'false'}\n")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit("released migration files were touched; see the ::error lines above")
          print("freeze check: no released migration file was modified, renamed or deleted")
          PY
          # The upgrade leg needs the merge-base SHA again; persist it.
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - name: Migrate a base-version database to this branch's chain
        if: steps.freeze.outputs.touched == 'true'
        run: |
          set -euo pipefail
          workspace="$PWD"
          # A second sync, and a deliberate exception to "the shared action is
          # the only place CI builds an environment": the base worktree runs
          # the MERGE BASE's code against the BASE lockfile, which no single
          # environment can serve. It is still the sanctioned form --locked,
          # and the branch leg below uses the environment the action built.
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          uv sync --locked --all-extras --group dev
          echo "--- leg 1: the merge base's chain builds the base-version database"
          uv run --no-sync python - <<'PY'
          import asyncio

          import asyncpg

          from taskq import migrate
          from taskq.settings import TaskQSettings

          async def main() -> None:
              settings = TaskQSettings.load()
              conn = await asyncpg.connect(str(settings.pg_dsn))
              try:
                  applied = await migrate.apply_pending(
                      conn, schema=settings.schema_name, phase=None
                  )
                  last = applied[-1].key if applied else "none"
                  print(f"base chain: applied {len(applied)} migrations (up to {last})")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
          cd "$workspace"
          echo "--- leg 2: this branch's chain applies what is pending, and must converge"
          uv run --no-sync python - <<'PY'
          import asyncio

          import asyncpg

          from taskq import migrate
          from taskq.settings import TaskQSettings

          async def main() -> None:
              settings = TaskQSettings.load()
              schema = settings.schema_name
              conn = await asyncpg.connect(str(settings.pg_dsn))
              try:
                  await migrate.apply_pending(conn, schema=schema, phase=None)
                  applied = await migrate.list_applied(conn, schema)
                  discovered = migrate.discover()
                  pending = [m.key for m in discovered if m.key not in applied]
                  assert not pending, (
                      "the upgrade did not converge: "
                      f"{len(pending)} migration(s) still pending: {pending}"
                  )
                  # Convergence above is one-directional: it proves the branch
                  # applies everything it ships, and is silent about ledger
                  # entries the branch no longer ships. The freeze check cannot
                  # see a released file that was never pinned in the manifest,
                  # so a delete or rename of one would otherwise upgrade
                  # "green" while fresh databases silently lost the schema the
                  # migration created.
                  vanished = sorted(applied - {m.key for m in discovered})
                  assert not vanished, (
                      "the upgrade dropped migration(s) this branch no longer "
                      f"ships: {vanished}; a released migration file may not "
                      "be deleted or renamed; fix forward with a new migration"
                  )
                  # Strict byte equality for every migration the ledger holds.
                  # The runner's own drift check accepts a bundled published
                  # variant as the ledger's checksum -- right at RUNTIME, wrong
                  # HERE: a PR could rewrite a released file and bundle its old
                  # bytes as a "variant", laundering the rewrite past the drift
                  # check. This ledger was built by the merge base's own code,
                  # so any difference from this branch's current bytes is a
                  # rewritten released file, full stop.
                  ledger = {
                      r["version"]: r["checksum"]
                      for r in await conn.fetch(
                          f'SELECT version, checksum FROM "{schema}".schema_migrations'
                      )
                  }
                  rewritten = [
                      f"{m.key}: ledger {ledger[m.key][:12]} != file "
                      f"{m.checksum(schema)[:12]}"
                      for m in discovered
                      if m.key in ledger and ledger[m.key] != m.checksum(schema)
                  ]
                  assert not rewritten, (
                      "the upgrade rewrote released migration file(s); a "
                      f"bundled variant does not bless a rewrite: {rewritten}"
                  )
                  drifts = await migrate.checksum_drifts(conn, schema=schema)
                  assert not drifts, f"checksum drift after the upgrade: {drifts}"
                  print(
                      f"upgrade converged: {len(applied)} applied, 0 pending, "
                      "0 checksum drift"
                  )
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v7

      # `sync-args: ""`: this job builds and inspects distributions and never
      # needs a project environment, so the shared action pins the interpreter
      # and stops there rather than installing 116 packages nothing will use.
      - uses: ./.github/actions/setup-uv-env
        with:
          sync-args: ""

      - name: Build package
        run: uv build

      # `--no-project`, not `--no-sync`: this job never syncs, and these are
      # stdlib-only inspections of the built artifacts that need no project
      # environment at all. A bare `uv run` here would create and populate a
      # whole .venv purely to reach `python -m zipfile`; `--no-sync` would
      # instead create an EMPTY venv, since --no-sync does not stop uv from
      # creating a missing one, only from populating it. `--no-project`
      # creates nothing and uses the interpreter UV_PYTHON names.
      - name: Check package contents
        run: |
          ls -la dist/
          uv run --no-project python -m tarfile -l dist/*.tar.gz
          uv run --no-project python -m zipfile -l dist/*.whl

      - name: Assert wheel ships required non-code artifacts
        run: |
          set -euo pipefail
          listing="$(uv run --no-project python -m zipfile -l dist/*.whl)"
          echo "$listing" | grep -q "taskq/py.typed"
          echo "$listing" | grep -q "taskq/migrations/01.00.00_01_pre_initial.sql"
          echo "$listing" | grep -q "taskq/migrations/_variants/"
          # ^ migrate.py's checksum-drift check reads the published variant
          # history from the installed package (importlib.resources); a wheel
          # without it silently narrows every accepted-checksum set to the
          # current file only.
          echo "$listing" | grep -q "taskq/web/templates/"

      - name: Test installation from wheel
        run: |
          uv venv test-env
          uv pip install --python test-env/bin/python dist/*.whl
          cd /tmp && $GITHUB_WORKSPACE/test-env/bin/python -c "import taskq; print(taskq.__version__)"

      - name: Test installation from source distribution
        run: |
          uv venv test-src-env
          uv pip install --python test-src-env/bin/python dist/*.tar.gz
          cd /tmp && $GITHUB_WORKSPACE/test-src-env/bin/python -c "import taskq; print(taskq.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

# The Postgres version window is covered by the system-e2e lane's matrix
# (PG 15-18 via TASKQ_TEST_PG_IMAGE); the fast `test` suite and the e2e lane
# still run against PG 18 only. Putting the full suite on the version matrix
# too remains deferred — cost/time tradeoff.
