name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build and publish (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      # See the uv discipline comment at the top of ci.yaml. The version check
      # below reads installed distribution metadata, so the project has to be
      # in the environment. It used to arrive via the implicit sync inside a
      # bare `uv run`, which resolved and installed whatever it liked on the
      # release path; syncing through the shared action makes the release
      # verify against the locked dependency set instead. `--no-dev` is the
      # sanctioned pruning for a deployment artifact -- nothing in the dev
      # group has any bearing on the packaged version.
      - uses: ./.github/actions/setup-uv-env
        with:
          sync-args: --no-dev

      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
          DIST_NAME: taskq-py
        run: |
          set -euo pipefail
          tag="${TAG_NAME#v}"
          version="$(uv run --no-sync python -c 'import importlib.metadata, os; print(importlib.metadata.version(os.environ["DIST_NAME"]))')"
          echo "Tag: ${tag}"
          echo "project version: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Git tag ${tag} does not match project version ${version}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test install from wheel
        env:
          DIST_NAME: taskq-py
        run: |
          uv venv test-env
          uv pip install --python test-env/bin/python dist/*.whl
          cd /tmp && $GITHUB_WORKSPACE/test-env/bin/python -c "import importlib.metadata, os; print(importlib.metadata.version(os.environ['DIST_NAME']))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/taskq-py/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
