services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: taskq
      POSTGRES_PASSWORD: taskq
      POSTGRES_DB: taskq
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskq"]
      interval: 2s
      retries: 15
      start_period: 10s

  redis:
    image: redis:8.10.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # Every taskq-example service runs `uv run --no-sync` (not bare `uv run`):
  # bare `uv run` re-syncs the project environment at container start, which
  # pulls the dev dependency group (pyright, mkdocs, ruff, ...) over the
  # network on every cold start and discards the image's `--no-dev` runtime
  # state. The image venv is already synced (`uv sync --locked --no-dev` in
  # examples/Dockerfile), so `--no-sync` starts instantly, offline, with
  # exactly the packages the image shipped.
  worker-1:
    # TASKQ_EXAMPLE_IMAGE pins a pre-built, content-hashed image (see
    # benchmarks/example_image_spec.py): when set and present locally, compose
    # skips the docker build entirely. Unset, this is the stock behavior
    # (compose builds examples/Dockerfile and tags it taskq-example:dev).
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync python examples/worker.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev
      TASKQ_QUEUES: examples

  worker-2:
    # TASKQ_EXAMPLE_IMAGE pins a pre-built, content-hashed image (see
    # benchmarks/example_image_spec.py): when set and present locally, compose
    # skips the docker build entirely. Unset, this is the stock behavior
    # (compose builds examples/Dockerfile and tags it taskq-example:dev).
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync python examples/worker.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev
      TASKQ_QUEUES: examples

  app:
    # TASKQ_EXAMPLE_IMAGE pins a pre-built, content-hashed image (see
    # benchmarks/example_image_spec.py): when set and present locally, compose
    # skips the docker build entirely. Unset, this is the stock behavior
    # (compose builds examples/Dockerfile and tags it taskq-example:dev).
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync uvicorn examples.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev
      TASKQ_EXAMPLE_HOST: "0.0.0.0"
      TASKQ_EXAMPLE_PORT: "8000"
      TASKQ_ADMIN_URL: http://localhost:8001
      TASKQ_MIGRATE_ON_START: "true"

  admin:
    # TASKQ_EXAMPLE_IMAGE pins a pre-built, content-hashed image (see
    # benchmarks/example_image_spec.py): when set and present locally, compose
    # skips the docker build entirely. Unset, this is the stock behavior
    # (compose builds examples/Dockerfile and tags it taskq-example:dev).
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync uvicorn examples.admin_app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev
      TASKQ_ADMIN_HOST: "0.0.0.0"
      TASKQ_ADMIN_PORT: "8001"
      TASKQ_MIGRATE_ON_START: "true"

  fastapi-app:
    profiles: [example]
    # TASKQ_EXAMPLE_IMAGE pins a pre-built, content-hashed image (see
    # benchmarks/example_image_spec.py): when set and present locally, compose
    # skips the docker build entirely. Unset, this is the stock behavior
    # (compose builds examples/Dockerfile and tags it taskq-example:dev).
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync uvicorn examples.fastapi_app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev

volumes:
  pgdata:
