services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: taskq
      POSTGRES_PASSWORD: taskq
      POSTGRES_DB: taskq
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskq"]
      interval: 2s
      retries: 15
      start_period: 10s

  redis:
    image: redis:8.10.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # Every taskq-example service runs `uv run --no-sync` (not bare `uv run`):
  # bare `uv run` re-syncs the project environment at container start, which
  # pulls the dev dependency group (pyright, mkdocs, ruff, ...) over the
  # network on every cold start and discards the image's `--no-dev` runtime
  # state. The image venv is already synced (`uv sync --locked --no-dev` in
  # examples/Dockerfile), so `--no-sync` starts instantly, offline, with
  # exactly the packages the image shipped.
  worker-1:
    # TASKQ_EXAMPLE_IMAGE pins a pre-built, content-hashed image (see
    # benchmarks/example_image_spec.py): when set and present locally, compose
    # skips the docker build entirely — set TASKQ_EXAMPLE_PULL_POLICY=missing
    # with it (the README's fast path does). Unset, the pull policy defaults
    # to `build`: every `up` REBUILDS the image, so a cold start can never
    # silently serve another tree's stale `taskq-example:dev` (the attack-4
    # finding: the worktree-GLOBAL tag reused an image built elsewhere — the
    # demo's routes were yesterday's).
    pull_policy: ${TASKQ_EXAMPLE_PULL_POLICY:-build}
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync python examples/worker.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev
      TASKQ_QUEUES: examples

  worker-2:
    # See worker-1's pull-policy note: the default is `build` (fresh every
    # up); the content-hashed fast path opts out with TASKQ_EXAMPLE_PULL_POLICY=missing.
    pull_policy: ${TASKQ_EXAMPLE_PULL_POLICY:-build}
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync python examples/worker.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev
      TASKQ_QUEUES: examples

  app:
    # See worker-1's pull-policy note: the default is `build` (fresh every
    # up); the content-hashed fast path opts out with TASKQ_EXAMPLE_PULL_POLICY=missing.
    pull_policy: ${TASKQ_EXAMPLE_PULL_POLICY:-build}
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync uvicorn examples.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev
      TASKQ_EXAMPLE_HOST: "0.0.0.0"
      TASKQ_EXAMPLE_PORT: "8000"
      TASKQ_ADMIN_URL: http://localhost:8001
      TASKQ_MIGRATE_ON_START: "true"
      # THE DEMO'S CENTRAL PROPERTY (attack-4 F-P4-DEMO-DEAD-RESOLVE's
      # cure): the trigger's 202 URL lands HERE — the run page renders on
      # THIS process's embedded admin, and its Resolve form POSTs to THIS
      # process's actions route. Without the actions opt-in the form's
      # POST answers 403 and the demo cannot resolve its own hold.
      # TASKQ_ADMIN_UI_SECURE_COOKIES comes off too: this stack is plain
      # http on a published port, and a Secure CSRF cookie is refused
      # there (the flag's own doc: http-only local development).
      TASKQ_ADMIN_ACTIONS_ENABLED: "true"
      TASKQ_ADMIN_UI_SECURE_COOKIES: "false"

  admin:
    # See worker-1's pull-policy note: the default is `build` (fresh every
    # up); the content-hashed fast path opts out with TASKQ_EXAMPLE_PULL_POLICY=missing.
    pull_policy: ${TASKQ_EXAMPLE_PULL_POLICY:-build}
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync uvicorn examples.admin_app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev
      TASKQ_ADMIN_HOST: "0.0.0.0"
      TASKQ_ADMIN_PORT: "8001"
      # The example stack is a dev deployment: the action buttons (cancel,
      # retry, run-now) WORK here - the sidecar builds a Backend (the
      # embedding contract) and the setting opts the mutations in. The
      # CSRF cookie's Secure flag comes off too: this stack is plain http
      # on a published port, and a Secure cookie is refused there (the
      # flag's own doc: http-only local development). The compose e2e
      # drives a live cancel through these buttons.
      TASKQ_ADMIN_ACTIONS_ENABLED: "true"
      TASKQ_ADMIN_UI_SECURE_COOKIES: "false"
      TASKQ_MIGRATE_ON_START: "true"

  fastapi-app:
    profiles: [example]
    # See worker-1's pull-policy note: the default is `build` (fresh every
    # up); the content-hashed fast path opts out with TASKQ_EXAMPLE_PULL_POLICY=missing.
    pull_policy: ${TASKQ_EXAMPLE_PULL_POLICY:-build}
    image: ${TASKQ_EXAMPLE_IMAGE:-taskq-example:dev}
    build:
      context: ..
      dockerfile: examples/Dockerfile
    command: uv run --no-sync uvicorn examples.fastapi_app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TASKQ_PG_DSN: postgresql://taskq:taskq@postgres/taskq
      TASKQ_REDIS_URL: redis://redis:6379
      TASKQ_ENVIRONMENT: dev

volumes:
  pgdata:
