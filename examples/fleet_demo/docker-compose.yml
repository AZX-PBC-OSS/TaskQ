# The fleet demo's own infrastructure, isolated from any other TaskQ stack
# on this machine: Postgres 18 + Redis on dedicated ports (5433 / 6380), a
# dedicated compose project, and a dedicated volume. Bring it up with:
#
#   docker compose -p taskq-fleet-demo -f examples/fleet_demo/docker-compose.yml up -d --wait
#
# `run_demo.py` runs exactly that command for you (and `down -v` on demand).
name: taskq-fleet-demo

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: taskq
      POSTGRES_PASSWORD: taskq
      POSTGRES_DB: taskq
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskq -d taskq"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.10.2
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
