# Example workgroup configuration — multi-queue worker supervision.
#
# This TOML file configures a TaskQ workgroup supervisor that manages
# multiple worker processes with independent queue assignments and
# concurrency budgets. Use it with:
#
#   uv run taskq workgroup start examples/workgroup.toml
#
# The supervisor spawns one child process per [[workers]] entry, monitors
# them for crashes, and restarts with exponential backoff.

# Children are plain `taskq worker` subprocesses, which build no DI
# registry: examples.worker:ACTORS includes DI actors (fetch, db_lookup,
# send_digest_email) that would fail bootstrap validation with
# MissingProvider. CLI_ACTORS is the DI-free subset — see
# examples/worker.py.
actors = "examples.worker:CLI_ACTORS"

[defaults]
worker_group = "examples"

[supervisor]
# 100.0 (the default) because a child's held release needs the 40s
# graces floor and its clean exit ~82s; anything under 40 trips
# workgroup.shutdown_grace_below_release_floor at startup, anything
# under 82 trips workgroup.shutdown_grace_below_clean_exit_floor.
shutdown_grace = 100.0
backoff_initial = 0.5
backoff_max = 30.0
burst_limit = 10
burst_window = 60.0

# High-throughput worker for the main examples queue.
# Polls frequently and allows 8 concurrent jobs.
[[workers]]
name = "api"
queues = ["examples"]
max_concurrency = 8
poll_interval = 0.5

[workers.health]
enabled = true
check_interval = 15
stale_after = 60
startup_grace = 15.0
consecutive_failure_limit = 3

# Low-throughput worker for background tasks.
# Longer poll interval, fewer concurrent jobs — ideal for CPU-bound actors
# like generate_thumbnail that should not monopolize the event loop.
[[workers]]
name = "background"
queues = ["examples"]
max_concurrency = 2
poll_interval = 2.0
