groups:
  - name: taskq.rules
    rules:
      - alert: TaskQQueueDepthHigh
        expr: max by (actor, queue) (taskq_jobs_oldest_pending_age_seconds) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            TaskQ actor {{ $labels.actor }} on queue {{ $labels.queue }} has
            pending work {{ $value }}s old
          description: >-
            An actor's oldest PENDING job has been waiting past the
            threshold (15 minutes) for 5 minutes. Attributed per actor, not
            per queue: no worker refuses to start because an actor's queue
            has no consumer — in a multi-worker fleet no supervisor can
            know what consumes a queue — so a misrouted actor produces no
            refusal, no error and no failed job, and its rows simply pile
            up pending while every probe stays green. A queue-summed depth
            cannot tell that apart from a busy shared queue; this actor's
            own age series rises without bound while its queue-mates stay
            flat. Age rather than depth, because a deep queue that drains
            is healthy throughput. Check that some worker's TASKQ_QUEUES
            includes this actor's declared queue. Operators should override
            the threshold in their own rule configuration.

      - alert: TaskQHeartbeatMisses
        expr: rate(taskq_heartbeat_misses_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TaskQ worker heartbeat misses detected"
          description: >-
            Heartbeat renewal failures detected. If misses continue, the
            worker will self-isolate. Investigate PG connectivity
            and lock lease configuration.

      - alert: TaskQFailedJobRateHigh
        expr: |
          sum(rate(messaging_client_consumed_messages_total{outcome="failed"}[5m]))
          / sum(rate(messaging_client_consumed_messages_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ terminal-failed job share > 1%"
          description: >-
            Attempts ending in a TERMINAL failure (outcome="failed": a
            non-retryable class, or the retry budget exhausted) exceed 1% of
            consumed attempts over the last 5 minutes. Retried failures are
            not in this share — they end as outcome="scheduled" and are
            counted by taskq_jobs_attempt_failures_total{retryable="true"}
            (TaskQRetryRateHigh). An attempt whose TERMINAL WRITE failed on
            infrastructure (a transient Postgres outage at the wrong moment)
            also ends as outcome="failed" and is re-claimed after the lease
            lapses, so a spike coinciding with database errors is an infra
            signal, not an actor-failure signal: the terminal-write-failed
            ERROR log and a job row still running with no error_class are
            the tells. Both sides are summed to fleet-wide
            scalars so the ratio never silently empties on a label mismatch.
            Inspect job_attempts.error_class for the root cause. Runbook:
            docs/guides/runbooks.md#taskqfailedjobratehigh.

      - alert: TaskQRetryRateHigh
        expr: |
          sum(rate(taskq_jobs_attempt_failures_total{retryable="true"}[5m]))
          / sum(rate(messaging_client_consumed_messages_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ retried-failure share > 10%"
          description: >-
            More than 10% of consumed attempts over the last 5 minutes ended
            in a failure that was rescheduled for another try, sustained for
            10 minutes. Each retry burns an attempt, a backoff delay and a
            worker slot, so a sustained rate is a dependency that is failing
            under retry cover — invisible on the terminal-failure share
            until budgets run out. Split by actor and error_type on
            taskq_jobs_attempt_failures_total to find it. Runbook:
            docs/guides/runbooks.md#taskqretryratehigh.

      - alert: TaskQAbandonedJobs
        expr: rate(taskq_jobs_abandoned_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TaskQ abandoned jobs detected (actor {{ $labels.actor }})"
          description: >-
            A job was abandoned: an operator-requested cancel outlasted both
            grace periods (the actor was asked to stop, then forced, and
            never exited), so the running attempt was taken from it.
            Shutdowns never produce this — a deploy releases (interrupts)
            in-flight jobs back to the fleet instead — so any rate is worth
            a page. Recorded by mark_abandoned itself, on the row write;
            a retry or snooze is outcome="scheduled" on the consumed-messages
            counter and never reaches this series. Inspect job_attempts rows
            with outcome='cancelled' and error_class='CancelAbandoned'. Runbook:
            docs/guides/runbooks.md#taskqabandonedjobs.

      - alert: TaskQLockExpiringSoon
        expr: histogram_quantile(0.99, rate(taskq_lock_expires_in_seconds_bucket[5m])) < 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ lock p99 remaining time < 30s"
          description: >-
            The lease left on job locks when the heartbeat renewed them
            (lock_lease minus the measured gap since the previous renewal)
            has a p99 below 30s: renewals are landing late — a slow
            heartbeat pool, failed ticks (taskq_heartbeat_misses_total) or a
            blocked event loop (taskq_worker_event_loop_lag_seconds) — and
            the reclaim sweep will take the jobs if the gap reaches the
            lease. Investigate PG latency or heartbeat interval configuration.

      - alert: TaskQLeaderSplitBrainOrNoLeader
        expr: sum(taskq_maintenance_leader_is_leader) != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TaskQ leader count is {{ $value }} (expected exactly 1)"
          description: >-
            Sum of taskq_maintenance_leader_is_leader across all pods is
            not 1. Either no leader is elected (0) or two pods both believe
            they are leader (>1). Both are split-brain conditions. Inspect
            pg_advisory_lock state.

      - alert: TaskQDispatchLatencyHigh
        expr: histogram_quantile(0.99, rate(taskq_dispatch_duration_seconds_bucket[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ dispatch p99 > 50ms (queue {{ $labels.queue }})"
          description: >-
            Dispatch query p99 exceeds 50ms, approaching the SKIP LOCKED
            ceiling. Investigate PG load, index health on jobs_dispatch_idx,
            and batch size configuration.

      - alert: TaskQProgressPublishFailures
        expr: rate(taskq_progress_publish_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ progress publish failures detected"
          description: >-
            Redis publish errors on progress events. Admin UI real-time
            mode will degrade to polling. Investigate Redis connectivity.

      - alert: TaskQCronScheduleDisabled
        expr: taskq_cron_disabled_schedules > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} TaskQ cron schedule(s) auto-disabled"
          description: >-
            One or more cron schedules have been auto-disabled after 3
            consecutive payload_factory failures (§6.6 three-strike rule).
            Inspect cron_schedules.last_fire_error to identify the
            affected schedule(s) and fix the payload_factory.

      - alert: TaskQScheduledBacklogGrowing
        expr: taskq_jobs_oldest_due_age_seconds > 300 and (taskq_jobs_scheduled_count > (taskq_jobs_scheduled_count offset 5m) or changes(taskq_jobs_scheduled_count[5m]) == 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ scheduled backlog is growing or has stalled while due jobs wait over 5m"
          description: >-
            The oldest due job has been waiting more than 5 minutes AND the
            scheduled job COUNT is demonstrably not draining — either it is
            higher than it was 5 minutes ago (promotion is not keeping up
            with arrivals) or it has not moved at all across those 5
            minutes. The second arm is the stalled plateau a strict growth
            comparison cannot see: a flat count never satisfies `count >
            count offset 5m`, so a promoter that has stopped completely
            while arrivals are absent or throttled would stay silent
            forever on the growth arm alone; changes(...) == 0 holds only
            when the count never moved across the whole window, which with
            a due job aging past the threshold means promotion is not
            happening. The previous form compared the oldest-due-age gauge
            against itself: that gauge tracks whichever single job is
            currently oldest, and its age climbs monotonically right up
            until THAT job is promoted regardless of how healthily
            everything behind it is draining — a steadily draining backlog
            whose oldest-due job simply hasn't had its turn yet satisfied
            the old expression for the whole `for: 5m` window and the check
            degenerated to a bare age>300 threshold. Count, not the single
            oldest item's age: a scheduled count that is MOVING — falling
            as jobs promote or rising as arrivals land — is healthy flow no
            matter how long the current straggler has waited; what is never
            healthy is a due job aging past the threshold while the count
            never moves at all.
            taskq_jobs_scheduled_count is the label-less twin of
            taskq_jobs_by_status{status="scheduled"}, kept in step with it
            by the same sampler tick, specifically so every operand here
            carries an identical (empty) label set — vector `and`/`or` with
            no `on`/`ignoring` modifier only pairs series whose label sets
            match exactly. Runbook:
            docs/guides/runbooks.md#taskqscheduledbackloggrowing.

      - alert: TaskQPromotionStalled
        expr: time() - taskq_maintenance_leader_sweep_last_success_seconds{sweep_name="scheduled_to_pending"} > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ scheduled_to_pending sweep has not completed in 2 minutes"
          description: >-
            The scheduled_to_pending sweep has not completed in 2 minutes —
            it ticks every second, so three missing sweep_intervals is a
            stall, not slowness. Same signature as the 12,732-job incident.
            Runbook: docs/guides/runbooks.md#taskqpromotionstalled.

      - alert: TaskQSweepTimeouts
        expr: rate(taskq_maintenance_leader_sweep_timeouts_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ sweep batches are being aborted, or a gauge sampler stopped reading"
          description: >-
            Sweep batches are being aborted by deadlines or server-side
            cancels — the database cannot finish bounded batches — or a
            gauge sampler's read did not complete. The sweep_name label
            says which: sweep names are aborted batches; the sampler names
            (queue_depth, backlog_detection, actor_backlog,
            reservation_slots) are reads that did not happen for ANY
            reason, counted every failure because a dead sampler's gauges
            go stale or absent while nothing else names the loss — the
            per-actor backlog read dying, for instance, resolves
            TaskQQueueDepthHigh at the exact moment the incident it
            alerts on is killing the read, and this counter is what
            keeps that failure observable. Runbook:
            docs/guides/runbooks.md#taskqsweeptimeouts.

      - alert: TaskQSweepDegraded
        expr: taskq_maintenance_leader_sweep_batch_size < taskq_maintenance_leader_sweep_batch_size_configured
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ sweep is running at the reduced batch tier"
          description: >-
            A sweep is reporting a batch size below its worker's configured
            event_writer_batch_size (TASKQ_EVENT_WRITER_BATCH_SIZE) — the
            reduced tier, meaning the worker itself is reporting an
            unhealthy database. The comparison is per-worker configuration:
            both series are emitted by the same worker under the same
            sweep_name label. Runbook:
            docs/guides/runbooks.md#taskqsweepdegraded.

      - alert: TaskQLeaderLockContention
        expr: sum(rate(taskq_leader_lock_contention_total[10m])) > 0 and sum(taskq_maintenance_leader_is_leader) < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ maintenance-lock contention is leaving the fleet with no leader"
          description: >-
            Maintenance-lock acquisitions are being lost AND no worker holds
            leadership. The second condition is what makes this alertable: a
            healthy multi-worker fleet has exactly one winner per election
            round and every other worker records a loss, so a lost-acquire
            rate above zero is the NORMAL steady state of any fleet larger
            than one worker — alerting on it alone pages on health. Losses
            while the leader count has fallen below one is the genuine
            signature: a second schema sharing the lock, or a stuck holder,
            so that no worker ever wins. Both operands are summed to
            fleet-wide scalars so the vector join pairs — an `and` between
            series carrying different label sets never matches, and
            Prometheus reports that as an empty result rather than an error.
            Runbook: docs/guides/runbooks.md#taskqleaderlockcontention.

      - alert: TaskQRateLimitDependencyOutage
        expr: rate(taskq_ratelimit_acquire_dependency_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ rate-limit acquires are failing on their store dependency"
          description: >-
            Rate-limit acquires are failing because the limiter's store
            (Redis, or the PG fallback behind it) could not answer, and the
            worker failed the acquire closed as a denial — every
            rate-limited dispatch is snoozing while the outage lasts. Read
            beside taskq_reservation_denials_total: a denial rate with this
            counter rising is an outage masquerading as contention. Runbook:
            docs/guides/runbooks.md#taskqratelimitdependencyoutage.

      - alert: TaskQCronLockContention
        expr: rate(taskq_cron_lock_contention_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ cron ticks are being lost to advisory-lock contention"
          description: >-
            Cron ticks are returning without firing because another session
            holds the cron advisory lock, sustained for 10 minutes. A brief
            low rate is benign leader-handover overlap; a sustained rate
            means cron is not running anywhere — a partitioned holder never
            releasing the transaction-scoped lock is the fleet-wide cron
            stall. Runbook: docs/guides/runbooks.md#taskqcronlockcontention.

      - alert: TaskQQueueUnserved
        expr: taskq_queue_depth{queue!="_other_"} > 0 unless on(queue) taskq_queue_live_workers > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TaskQ queue {{ $labels.queue }} has {{ $value }} queued jobs and no live worker"
          description: >-
            A queue holds pending or scheduled jobs and no worker whose
            heartbeat is inside the liveness window
            (TASKQ_ADMIN_WORKER_LIVENESS_SECONDS) subscribes to it, for 2
            minutes. Nothing will consume the work: a deploy dropped the
            queue from every TASKQ_QUEUES, the only replica serving it is
            down, or a producer enqueues onto a queue name nobody runs. Both
            series come from the same leader sampler tick, so the join never
            compares two moments; the `_other_` overflow bucket is excluded
            because its member set differs between the two gauges. Runbook:
            docs/guides/runbooks.md#taskqqueueunserved.

      - alert: TaskQStrandedJobs
        expr: taskq_jobs_stranded > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskQ actor {{ $labels.actor }} has {{ $value }} stranded jobs ({{ $labels.reason }})"
          description: >-
            Pending/scheduled jobs that can never dispatch, sustained for 5
            minutes, with the reason on the label: no_actor_config (the actor
            has no actor_config row — deregistered, or never registered by a
            worker) or unserved_queue (the queue dispatch routes the actor on
            has no live worker subscribed). Neither dispatch nor the deadline
            sweep will ever touch these rows; the leader's detector is the
            only signal. Runbook: docs/guides/runbooks.md#taskqstrandedjobs.

      - alert: TaskQRunningLeaseExpired
        expr: taskq_jobs_running_lease_expired > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TaskQ running jobs are stuck on expired leases"
          description: >-
            Running jobs whose lock lease is past expiry, sustained for 5
            minutes — with rows in a cancel phase carved out: the reclaim
            sweep deliberately waits cancel grace + cleanup grace + 60 s
            past expiry for a cancelling row before it pre-empts, so an
            expired lease mid-cancel is the protocol working, not an
            incident (a cancel that never completes pages as
            TaskQAbandonedJobs instead). A healthy fleet reads 0 — the
            reclaim sweep drains expired leases within a tick or two of
            expiry — so a sustained non-zero reading means reclaim is not
            draining: work is claimed and stuck while health probes stay
            green. Inspect the admin /jobs lease column (or
            jobs.lock_expires_at) for the holders. Runbook:
            docs/guides/runbooks.md#taskqrunningleaseexpired.
