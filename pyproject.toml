[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "src/taskq/testing"
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "src/taskq/ratelimit"
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "src/taskq/worker"
reportPrivateUsage = false
reportUnsupportedDunderAll = false

# SSO auth backends bind to untyped third-party libraries (authlib/joserfc,
# python3-saml/onelogin) that ship no type stubs. Relax the unknown-type
# reports at this boundary so pyright strict doesn't flag every call into
# those libraries; structural correctness is covered by the test suite.
[[tool.pyright.executionEnvironments]]
root = "src/taskq/web/admin/auth"
reportPrivateUsage = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

# taskq.aad binds to azure-identity, which ships no type stubs. Same
# rationale as the SSO auth boundary — relax unknown-type reports at this
# import boundary; structural correctness is covered by the test suite.
[[tool.pyright.executionEnvironments]]
root = "src/taskq/aad.py"
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportMissingImports = false

# taskq.aws binds to boto3, which ships no type stubs. Same rationale.
[[tool.pyright.executionEnvironments]]
root = "src/taskq/aws.py"
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportMissingImports = false

# taskq.vault binds to hvac, which ships no type stubs. Same rationale.
[[tool.pyright.executionEnvironments]]
root = "src/taskq/vault.py"
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportMissingImports = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportArgumentType = false
reportMissingImports = false
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "examples"
reportArgumentType = false
reportMissingImports = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportUntypedFunctionDecorator = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--dist=loadgroup",
    "--timeout=300",
]
filterwarnings = [
    # No testcontainers entry: every import migrated to the non-deprecated
    # testcontainers.community.* modules, so any future testcontainers
    # DeprecationWarning should SURFACE in the warnings summary, not be hidden.
    "ignore::DeprecationWarning:redis.*",
    "ignore::DeprecationWarning:onelogin.*",
]
markers = [
    "slow: marks tests as slow (skip with -m 'not slow')",
    "integration: marks tests requiring testcontainers",
    "redis: marks tests requiring the [redis] extra and a Redis container",
    "examples: marks tests for the example app (excluded from default CI run)",
    "e2e: end-to-end tests with containerized workers (requires --e2e opt-in; CI job 'e2e')",
]

[tool.coverage.run]
source = ["src/taskq"]
branch = true
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "def __repr__",
    "@abstractmethod",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "asyncpg-stubs>=0.31.3",
    "authlib>=1.7.2",
    "fakeredis>=2.37.0",
    "filelock>=3.32.4",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "hypothesis>=6.157.1",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.26.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    # `taskq.testing.otel` imports the SDK, now via the PUBLIC
    # opentelemetry.sdk.metrics.export path rather than the private
    # _internal.point one it used to reach for (the names are re-exported and
    # are the same objects; tests/test_otel_contract.py pins the field layout
    # the public path does not promise). Floor matches the core
    # opentelemetry-api floor so the suite can be resolved and run at the lower
    # bound; normal `uv sync` still resolves to the newest release.
    "opentelemetry-sdk>=1.30.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.16.5,<0.17",
    "testcontainers[postgres,redis]>=4.14.2",
]
# Containerized e2e tier (tests/e2e): container image builds for worker
# containers. Kept out of the default dev group so plain `uv sync` and
# non-e2e CI legs don't pull the docker SDK; collection of the tier is
# gated separately via pytest --e2e (root conftest.py).
e2e = [
    "containerspec[build]>=0.1.7",
]
