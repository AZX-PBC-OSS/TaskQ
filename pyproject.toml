[project]
name = "taskq-py"
version = "0.3.0"
description = "Async-native, Postgres-backed background job library for Python 3.12+"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "AZX, PBC.", email = "oss@azx.io" }]
keywords = ["jobs", "queue", "postgres", "asyncio", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "asyncpg>=0.31.0,<1",
    "croniter>=6.2.4",
    "dotenvmodel>=1.1.0,<2",
    # 1.30.0 is the real floor for TaskQ's import surface, not a
    # latest-at-the-time-of-writing pin. Most of what src/taskq uses is
    # long-stable (trace.Span/SpanKind/StatusCode/Tracer, metrics.
    # CallbackOptions/Meter/Observation, context.Context, util.types.
    # Attributes), but obs/_otel.py builds `taskq.leader.lock_expires_in`
    # with `create_histogram(..., explicit_bucket_boundaries_advisory=...)`
    # at import time, against the no-provider `_ProxyMeter`. `_ProxyMeter`
    # only accepts that kwarg from 1.30.0; on 1.29.0 and earlier importing
    # taskq raises TypeError outright. Verified by execution, not inference.
    # DO NOT raise this back toward the newest release without checking the
    # exporters that cap the API. azure-monitor-opentelemetry-exporter
    # declares `opentelemetry-api~=1.43.0` in every release through 1.0.0b56,
    # so a >=1.44.0 floor makes TaskQ and Azure Monitor / Application
    # Insights export mutually unresolvable.
    "opentelemetry-api>=1.30.0",
    "orjson>=3.11.9",
    "pydantic>=2.13.4,<3",
    "structlog>=26.1.0,<27",
    "typer>=0.27.0,<1",
    "uuid-utils>=0.17.0,<1",
]

[project.scripts]
taskq = "taskq.cli:main"

[project.urls]
Homepage = "https://github.com/AZX-PBC-OSS/TaskQ"
Documentation = "https://AZX-PBC-OSS.github.io/TaskQ/"
Repository = "https://github.com/AZX-PBC-OSS/TaskQ"
Issues = "https://github.com/AZX-PBC-OSS/TaskQ/issues"
Changelog = "https://github.com/AZX-PBC-OSS/TaskQ/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = [
    "redis>=8.0.1,<9",
]
fastapi = [
    "fastapi>=0.140.0,<1",
    "humanize>=4.16.0",
    "jinja2>=3.1.6",
    "sse-starlette>=3.4.6",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0,<1",
]
reload = [
    "watchfiles>=1.2.0",
]
otel = [
    # Not imported anywhere under src/taskq; kept optional for operators who
    # export OTLP directly or drive auto-instrumentation via
    # `opentelemetry-instrument`.
    # These floors track the OTLP/semconv release train, which is pinned far
    # more tightly than the core `opentelemetry-api` floor above:
    # opentelemetry-instrumentation requires opentelemetry-semantic-
    # conventions==<same beta>, and each semconv beta pins ONE exact API
    # version (0.63b0->api==1.42.0, 0.64b0->1.43.0, 0.65b0->1.44.0). A
    # >=0.65b0 floor therefore forces opentelemetry-api==1.44.0 and makes
    # `taskq-py[otel]` unresolvable next to azure-monitor-opentelemetry-
    # exporter (`opentelemetry-api~=1.43.0`). Same warning as the core pin:
    # do not raise these without re-checking that constraint.
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation>=0.64b0,<1",
]
prometheus = [
    # >=0.63b0 guarantees PrometheusMetricReader's public `registry=` kwarg
    # (opentelemetry-python #5055); earlier releases hard-coded the global
    # REGISTRY, which is not safe for isolated metric scrapes.
    "opentelemetry-exporter-prometheus>=0.63b0,<1",
    "prometheus-client>=0.26.0,<1",
]
oidc = [
    # OAuth2/OIDC client, discovery, and JWT/JWKS validation. Vendor-neutral —
    # works against any OIDC provider (Entra, Okta, Auth0, Google); no vendor SDK.
    # >=1.8.0: from that release the httpx_client integration is httpx2-first
    # (imports httpx2 directly; httpx is only a deprecated fallback), and 1.7.x
    # imported httpx unconditionally — a range this extra no longer ships httpx
    # for, hence the floor.
    "authlib>=1.8.0",
    # Sole HTTP client for the OIDC path: authlib's AsyncOAuth2Client subclasses
    # httpx2.AsyncClient for the OAuth2 token-exchange flow, and the direct
    # OIDC calls (discovery, JWKS fetch) import httpx2 — nothing under
    # src/taskq imports httpx. (The dev group keeps httpx for tests.)
    "httpx2>=2.9.1",
    # Signed session cookies (shared with the SAML backend via _session.py).
    "itsdangerous>=2.2.0,<3",
]
saml = [
    # OneLogin SP toolkit; xmlsec ships self-contained wheels on common platforms
    # (manylinux/musllinux/macos/windows) — no system libxmlsec1 needed there.
    # See docs/guides/sso.md for platform-specific notes.
    "python3-saml>=1.16.0",
    # Shared signed session cookies via _session.py.
    "itsdangerous>=2.2.0,<3",
]
aad = [
    # Microsoft Entra ID (AAD) managed-identity authentication for Azure
    # Database for PostgreSQL and Azure Cache for Redis. Used by the
    # credential providers in taskq.aad; see docs/guides/managed-identities.md.
    "azure-identity>=1.25.3,<2",
    # Async transport for azure.identity.aio credentials — azure-identity
    # treats aiohttp as a soft dependency, but constructing any async
    # credential (e.g. aio.DefaultAzureCredential) raises ImportError
    # without it.
    "aiohttp>=3.14.3,<4",
]
aws = [
    # AWS IAM database authentication for Amazon RDS Postgres. Used by the
    # credential providers in taskq.aws; see docs/guides/managed-identities.md.
    "boto3>=1.43.56,<2",
]
vault = [
    # HashiCorp Vault database secrets engine dynamic credentials. Used by
    # the credential providers in taskq.vault; see docs/guides/managed-identities.md.
    "hvac>=2.4.0,<3",
]

[tool.uv]
# Pin the uv toolchain to the validated 0.12.x line: setup-uv reads
# required-version from pyproject and installs the highest match in CI.
# A range (not ==) so contributors on any 0.12.x patch can run uv locally —
# an exact pin hard-fails every local uv command on any other version —
# while <0.13 keeps CI and local on the same validated minor line.
# Trade-off vs. an exact pin: setup-uv must consult the versions manifest to
# resolve the range (the fetch an exact pin skips); accepted per review.
# Lower bound is 0.12.7 (not 0.12.8): Dependabot's uv updater currently caps
# at 0.12.7, and a floor above that fails every uv update with
# tool_version_not_supported. CI still resolves to the newest 0.12.x, while
# Dependabot can use its supported 0.12.7 — both satisfy this range.
required-version = ">=0.12.7,<0.13"
# Supply-chain hardening: never resolve to distributions published within the
# last 24 hours, giving time for malicious releases to be detected and yanked.
exclude-newer = "24 hours"
# dotenvmodel is published by the same org (AZX-PBC-OSS) as TaskQ and is the
# only same-org dependency. Opt it out of the 24-hour supply-chain quarantine
# so same-day releases can be adopted immediately; this is deliberate and
# scoped to dotenvmodel only (every other dep still honors the cooldown).
# markupsafe is opted out for a different reason: it's a toolchain transitive
# (jinja2 via the fastapi extra; mkdocs, mkdocs-autorefs, and mkdocstrings
# via the dev group's docs toolchain) pinned exactly by the lockfile and
# audited on every bump, so the cooldown adds no protection while delaying
# same-day security releases.
exclude-newer-package = { dotenvmodel = "0d", markupsafe = false }
# Security floors for packages TaskQ does not depend on directly. A bare
# `uv lock --upgrade-package` fixes the resolution once; a constraint keeps it
# fixed, and fails the lock loudly if a parent ever pins back below the floor
# instead of silently regressing.
#
# cryptography>=50.0.0 -- PYSEC-2026-3552: RSA PKCS#1 v1.5 Bleichenbacher
# oracle in pkcs7_decrypt_*; pulled in by authlib (oidc extra, dev group),
# azure-identity/msal (aad extra) and joserfc. TaskQ never calls the PKCS#7
# decrypt APIs, so the finding is not reachable from this codebase, but the
# floor costs nothing and the extras hand cryptography to callers who might.
#
# pip>=26.2 -- PYSEC-2026-3721. pip is not a dependency of TaskQ at all; it
# arrives in the resolved environment as a build-time tool, which is why a
# constraint rather than a dependency bump is the lever that moves it.
constraint-dependencies = ["cryptography>=50.0.0", "pip>=26.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskq"]

[tool.hatch.build.targets.sdist]
include = ["src/taskq", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "ASYNC", # flake8-async (PEP 789 async-safety hazards)
    "S",     # bandit
    "C4",    # comprehensions
    "SIM",   # simplify
    "TID",   # flake8-tidy-imports (TID251 enforces the UUIDv7 invariant below)
    "RUF",   # ruff-specific
]
ignore = [
    # S101 stays global because production modules under src/taskq still
    # carry type-narrowing asserts (backend/, worker/, client/, cli.py,
    # auth.py, migrate.py, testing/) that must be converted to guards —
    # the RuntimeError-property pattern of
    # WorkerSettings.resolved_pg_dsn_direct — before this can be scoped
    # to tests/** only (tests/** already has its own S101 entry in
    # per-file-ignores).
    "S101",
    "E501",  # long lines (formatter handles)
]

# UUIDv7-only invariant (TID251). Every UUID TaskQ persists — job, worker,
# batch, actor, schedule and event ids — is minted by `new_uuid()` /
# `new_job_id()` in `src/taskq/_ids.py`, which wraps `uuid_utils.uuid7()`.
# UUIDv7 (RFC 9562 §5.7) puts a 48-bit big-endian Unix-millisecond timestamp
# in the leading bits, so ids are time-ordered: inserts land at the right-hand
# edge of the primary-key B-tree instead of scattering random pages across the
# index, and `ORDER BY id` is a usable creation-time order (the admin UI's
# keyset pagination and several tie-breakers rely on that). `uuid4` is
# uniformly random and destroys both properties, so it is banned outright
# rather than left to review to catch.
#
# The ban covers tests as well as src on purpose: tests are where the next
# contributor learns the house pattern, and an invariant contradicted on every
# page of `tests/` is not an invariant. The rule fires on `from uuid import
# uuid4`, on `uuid.uuid4(...)`, and through import aliases.
#
# A test that genuinely needs a NON-time-ordered or externally-minted id (e.g.
# proving an ordering does not depend on id) may keep `uuid4` with an explicit
# `# noqa: TID251` and a `Why:` comment saying so — that is the only sanctioned
# escape hatch, and it is visible in review.
#
# `uuid_utils.uuid7` is banned alongside `uuid4` so callers go through
# `new_uuid()`/`new_job_id()` (which return a stdlib `uuid.UUID`, not
# `uuid_utils.UUID`) rather than re-deriving the conversion; `_ids.py` itself
# is the single allowlisted call site, below.
#
# Python 3.14 added `uuid.uuid7()` to the stdlib, but this project supports
# 3.12+, so `uuid_utils` remains the correct source. If the floor ever moves to
# 3.14, only `_ids.py` changes — nothing else calls the generator directly.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"uuid.uuid4".msg = "TaskQ ids are UUIDv7. Use `new_uuid()` / `new_job_id()` from `taskq._ids` — uuid4 is random, which wrecks primary-key B-tree insert locality and makes `ORDER BY id` meaningless. If you genuinely need a non-time-ordered id, add `# noqa: TID251` with a `Why:` comment."
"uuid_utils.uuid4".msg = "TaskQ ids are UUIDv7. Use `new_uuid()` / `new_job_id()` from `taskq._ids` — uuid4 is random, which wrecks primary-key B-tree insert locality and makes `ORDER BY id` meaningless. If you genuinely need a non-time-ordered id, add `# noqa: TID251` with a `Why:` comment."
"uuid_utils.uuid7".msg = "Call `new_uuid()` / `new_job_id()` from `taskq._ids` instead of `uuid_utils.uuid7()` directly — they return a stdlib `uuid.UUID` and are the single generation seam the UUIDv7 invariant is enforced at."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The one sanctioned `uuid_utils.uuid7()` call site: `new_uuid()` is the seam
# every other module goes through, so the ban cannot apply to its definition.
"src/taskq/_ids.py" = ["TID251"]
# Same rationale — schema name validated against _IDENT_RE; all
# user-supplied values use $N parameter binding.
"tests/e2e/**" = ["S608"]
"tests/test_workgroup.py" = ["S108", "ASYNC110"]
# Exception class names follow the project glossary verbatim
# (Snooze, RetryAfter, ResultTooLarge, ScopeViolation, etc.).
"src/taskq/exceptions.py" = ["N818"]
# ASYNC109: _consume_transactional and _consume_autonomous accept a
# pre-computed start_to_close timeout from the job row; this is not a
# user-facing async-with-timeout API — the timeout is consumed
# internally by asyncio.wait_for, not exposed as an alternative to
# asyncio.timeout(). SIM117: loop_conn.transaction() wrapping the
# actor body + mark_succeeded_with_conn cannot be flattened into a
# combined async-with because the conn is a parameter, not acquired
# from a pool inside the function.
"src/taskq/worker/_consumer.py" = ["ASYNC109", "SIM117"]
# Schema name is validated against _IDENT_RE before interpolation; bandit
# cannot trace that across function boundaries. asyncpg has no parameter
# binding for identifiers, so we have to interpolate.
"src/taskq/migrate.py" = ["S608"]
# Schema name is validated against _IDENT_RE before interpolation; same
# rationale as migrate.py.  All user-supplied values use $N parameter
# binding — only the schema identifier is interpolated, and it is
# validated at construction time.
"src/taskq/backend/postgres.py" = ["S608", "SIM117"]
# S608: schema name is validated against _IDENT_RE before interpolation; same
# rationale as migrate.py.  All user-supplied values use $N parameter binding.
